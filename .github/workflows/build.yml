name: Build and release desktop apps

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
            extension: msi
          - os: macos-15-intel
            platform: macos-x64
            extension: dmg
          - os: ubuntu-24.04
            platform: linux-x64
            extension: deb
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v?[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Release tag must use X.Y.Z or vX.Y.Z, for example v3.1.2')
          version = tag.removeprefix('v')
          checks = {
              'build.gradle.kts': r'packageVersion\s*=\s*"([^"]+)"',
              'src/main/kotlin/Constants.kt': r'const val VERSION:\s*String\s*=\s*"([^"]+)"',
          }
          for filename, pattern in checks.items():
              match = re.search(pattern, Path(filename).read_text(encoding='utf-8'))
              if match is None or match.group(1) != version:
                  raise SystemExit(f'Update the version in {filename} to {version} before publishing this release')
          PY

      - name: Install Linux packaging tools
        if: runner.os == 'Linux' && github.event_name != 'push' && github.event_name != 'pull_request'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot

      - name: Configure preinstalled Windows WiX tools
        if: runner.os == 'Windows' && github.event_name != 'push' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $wixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $wixBin 'candle.exe'))) {
            throw "WiX 3.14 is missing from the runner image"
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "WIX_PATH=$wixBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile with dependency download retries
        run: |
          for attempt in 1 2 3; do
            if bash ./gradlew compileKotlin --no-daemon --stacktrace 2>&1 | tee compile.log; then
              exit 0
            fi
            if ! grep -Eiq 'HTTP status code: (429|50[234])|status code (429|50[234])|Gateway Time-out|Read timed out|Connect timed out|Connection reset' compile.log; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 15))"
          done

      - name: Run tests
        run: bash ./gradlew test --no-daemon --stacktrace

      - name: Build native installer
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: bash ./gradlew packageReleaseDistributionForCurrentOS --no-daemon --stacktrace

      - name: Print packaging diagnostics
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          logs = sorted(Path('build/compose/logs').rglob('*.txt'))
          logs += sorted(Path('build/compose/tmp').glob('*.args.txt'))
          for path in logs:
              print(f'\n--- {path} ---', flush=True)
              print(path.read_text(encoding='utf-8', errors='replace'), flush=True)
          PY

      - name: Collect installer
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          PACKAGE_EXTENSION: ${{ matrix.extension }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          extension = os.environ['PACKAGE_EXTENSION']
          packages = list(Path('build/compose/binaries/main-release').rglob(f'*.{extension}'))
          if len(packages) != 1:
              raise SystemExit(f'Expected one .{extension} installer, found {packages}')
          destination = Path('dist')
          destination.mkdir(exist_ok=True)
          package = packages[0]
          shutil.copy2(package, destination / f'{package.stem}-{os.environ["PACKAGE_PLATFORM"]}{package.suffix}')
          PY

      - name: Save native installer
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Save test and packaging reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.platform }}
          path: |
            build/reports/
            build/test-results/
            build/compose/logs/
          if-no-files-found: ignore
          retention-days: 7

  upload-release:
    name: Upload release installers
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist

      - name: Attach installers to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
